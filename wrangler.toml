# Cloudflare Pages serves site/ and functions/api from this repo.
# GitHub Pages still publishes site/ from main. Do not add a second GitHub remote.
# Build command: python3 pipeline/prepare-preview.py
# That command does nothing unless HABIBI_PREVIEW=1. See docs/CLOUDFLARE-SETUP.md.
name = "habibi-crafts-api"
pages_build_output_dir = "site"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PRINTFUL_STORE_ID = "18687336"
PRINTFUL_CONFIRM_ORDERS = "false"
